<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>Agent Cody</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="expanded">
    <header class="titlebar">
      <div class="brand"><span class="brand-mark" id="brand-mark"></span><span>Agent Cody</span><span class="count" id="count"></span></div>
      <div class="actions">
        <button id="btn-mute" class="icon-btn" title="Mute notification sounds" aria-label="Mute notification sounds"></button>
        <button id="btn-menu" class="icon-btn" title="Menu" aria-label="Menu"></button>
        <button id="btn-collapse" class="icon-btn" title="Collapse to pill" aria-label="Collapse to pill"></button>
        <button id="btn-hide" class="icon-btn" title="Hide (tray icon brings it back)" aria-label="Hide"></button>
      </div>
    </header>
    <div id="banner" class="banner" hidden></div>
    <main id="list" aria-live="polite"></main>
    <div id="empty" class="empty" hidden>
      <div class="empty-mark" id="empty-mark"></div>
      <p id="empty-text"></p>
      <button id="btn-install" class="primary" hidden>Install Claude Code hooks</button>
    </div>
    <div id="toast" class="toast" role="status"></div>
  </div>

  <div id="pill" hidden>
    <span class="grip" title="Drag"></span>
    <button id="pill-btn" title="Expand">
      <span class="dot" id="pill-dot"></span><span id="pill-text">0 agents</span>
    </button>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
